[project]
name = "extrahorizon"
version = "0.2.0"
description = "ExtraHorizon — emotion-aware voice tutor backend (local vision + emotion model, voice pipeline, adaptive LLM context)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.60,<4",
  "numpy>=2.0",
  "mediapipe>=1.0.1,<2",
  "onnxruntime>=1.20",
  "ormsgpack>=1.5",
  "websockets>=13",
]

[project.scripts]
extrahorizon = "extrahorizon.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extrahorizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
